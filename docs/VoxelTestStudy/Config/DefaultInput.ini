;=============================================================
; VoxelCosmos 输入配置
;
; 复制到你的工程 Config/DefaultInput.ini，
; 或者直接合并到已有文件里。
;
; 说明：这里用的是 UE 传统输入轴方案（BindAxis），
; 而非 Enhanced Input。这样不需要在编辑器里手动创建
; InputAction 资产，配置全部集中在 ini 里，可版本控制。
;=============================================================

[/Script/Engine.InputSettings]
; 取消注释以启用这些轴（默认项目里通常都被注释掉了）
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=E)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Q)

+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=PageUp)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=PageDown)

+AxisMappings=(AxisName="MoveUp",Scale=1.000000,Key=SpaceBar)
+AxisMappings=(AxisName="MoveUp",Scale=-1.000000,Key=LeftControl)

; 视角旋转：右键拖动
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=RightMouseButton)
+AxisMappings=(AxisName="Turn",Scale=-1.000000,Key=LeftMouseButton)
+AxisMappings=(AxisName="LookUp",Scale=1.000000,Key=RightMouseButton)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=LeftMouseButton)

; 游戏内轴不参与 UI，避免鼠标拖动时误触
+AxisMappings=(AxisName="Turn",Scale=0.000000,Key=Gamepad_LeftX,bGamepad=True)
+AxisMappings=(AxisName="LookUp",Scale=0.000000,Key=Gamepad_LeftY,bGamepad=True)


[/Script/Engine.InputSettings+ActionMappings]
; 速度档位调整
+ActionMappings=(ActionName="SpeedUp",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=MouseWheelUp)
+ActionMappings=(ActionName="SpeedDown",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=MouseWheelDown)

; 加速 / 减速
+ActionMappings=(ActionName="Boost",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=LeftShift)
+ActionMappings=(ActionName="Precision",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=LeftControl)

; 聚焦
+ActionMappings=(ActionName="FocusNearest",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=F)
+ActionMappings=(ActionName="CycleTarget",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Tab)
