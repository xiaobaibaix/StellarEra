; 生成器来还原它们 —— UniverseMap 第三颗行星实测 36 秒，关掉后同样内容 3.4 秒。
; 存与读必须一致：两者都是 0。旧格式存档已用 StellarEra.Planet.ResaveAll 0 迁移过。
